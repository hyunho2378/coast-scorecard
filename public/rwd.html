<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>반응형 확인</title>
<style>body{margin:0;background:#050B16;color:#F2F6FC;font-family:Pretendard,sans-serif}p{margin:8px 16px;font-size:13px}iframe{display:block;margin:0 auto;border:0;background:#08111F}</style></head>
<body><p id="cap"></p><iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search)
const w = Number(q.get('w') || 390), h = Number(q.get('h') || 844)
const f = document.getElementById('f')
f.width = w; f.height = h; f.style.width = w + 'px'; f.style.height = h + 'px'
f.src = '/' + (q.get('hash') ? '#' + q.get('hash') : '')
document.getElementById('cap').textContent = '확인 폭 ' + w + ' x ' + h
</script></body></html>
