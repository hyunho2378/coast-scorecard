<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연안정비사업 성적표</title>
    <link rel="icon" href="data:," />
    <script>
      // 개발 확인용 오류 수집. 화면에는 아무것도 그리지 않고 window.__errs 에만 쌓는다
      window.__errs = []
      window.addEventListener('error', function (e) { window.__errs.push('error ' + e.message) })
      window.addEventListener('unhandledrejection', function (e) { window.__errs.push('rejection ' + String(e.reason)) })
      ;['error', 'warn'].forEach(function (k) { var f = console[k]; console[k] = function () { window.__errs.push(k + ' ' + Array.prototype.join.call(arguments, ' ').slice(0, 300)); f.apply(console, arguments) } })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
